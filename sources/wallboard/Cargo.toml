[package]
name = "wallboard"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wallboard"
path = "src/main.rs"

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
png = "0.17"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "wallboard"
harness = false
